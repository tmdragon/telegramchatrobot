# /etc/nginx/sites-available/checkgprobot — HTTP-only 模式(无域名)
# 由 setup.sh --no-domain 自动部署。
# 公网入口走 80 端口;Basic Auth 守门。
# 启用: ln -s /etc/nginx/sites-available/checkgprobot /etc/nginx/sites-enabled/

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    # Basic Auth —— 用户名密码文件由 setup.sh 用 htpasswd 生成
    auth_basic           "checkGPRobot";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 健康检查放行(方便后续接监控)
    location = /api/health {
        auth_basic           off;
        proxy_pass          http://127.0.0.1:8765/api/health;
        proxy_set_header    Host $host;
    }

    # 把所有其他请求代理到本机 FastAPI
    location / {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}