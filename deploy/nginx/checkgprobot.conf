# /etc/nginx/sites-available/checkgprobot
# 反向代理 8765；公网入口走 443；Basic Auth 守门。
# 启用: ln -s /etc/nginx/sites-available/checkgprobot /etc/nginx/sites-enabled/
#       nginx -t && systemctl reload nginx

# 把 HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name _;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name _;

    # Let's Encrypt 证书（setup.sh 会用 certbot 自动申请）
    ssl_certificate     /etc/letsencrypt/live/YOUR_DOMAIN/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/YOUR_DOMAIN/privkey.pem;

    # 安全的 TLS 配置（中间档；IE11/老安卓不兼容但你应该是现代浏览器）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # Basic Auth —— 用户名密码文件由 setup.sh 用 htpasswd 生成
    auth_basic           "checkGPRobot";
    auth_basic_user_file /etc/nginx/.htpasswd;

    # 把所有请求代理到本机 FastAPI
    location / {
        proxy_pass         http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 不暴露 /health 给匿名（要登录才能看到）
    # FastAPI 的健康端点是 /health,不是 /api/health
    location = /health {
        auth_basic           off;       # 健康检查放行
        proxy_pass          http://127.0.0.1:8765/health;
        proxy_set_header    Host $host;
    }
}