<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}checkGPRobot{% endblock %}</title>
  <link rel="stylesheet" href="/static/css/app.css" />
  <script type="module" src="/static/js/page-bootstrap.js" defer></script>
</head>
<body data-page="{{ page_name or 'overview' }}">
  <aside class="sidebar" aria-label="主导航">
    <div class="sidebar__brand">📦 checkGPRobot</div>
    <nav class="sidebar__nav">
      <a href="/" class="sidebar__link" data-page-target="overview">
        <span class="sidebar__icon">📋</span>
        <span class="sidebar__label">项目总览</span>
      </a>
      <a href="/groups" class="sidebar__link" data-page-target="groups">
        <span class="sidebar__icon">📡</span>
        <span class="sidebar__label">群映射</span>
      </a>
      <a href="/mappings" class="sidebar__link" data-page-target="mappings">
        <span class="sidebar__icon">🔗</span>
        <span class="sidebar__label">映射管理</span>
      </a>
    </nav>
    <div class="sidebar__footer">v1 · 本地管理</div>
  </aside>

  <div class="main">
    {% include "partials/_status_bar.html" %}

    {% block content %}{% endblock %}
  </div>

  <div id="toast-container" class="toast-container" aria-live="polite"></div>
</body>
</html>
